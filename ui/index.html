<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTON POOL</title>
<meta name="description" content="Photon mining pool for Elektron Net: pool statistics, engine, miner lookup">
<link rel="icon" href="/favicon.ico" sizes="256x256">
<link rel="stylesheet" href="/style.css">
</head>
<body data-theme="cyan">
<div class="fx" aria-hidden="true"></div>
<div class="window spa" id="window">
  <header class="titlebar">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="wtitle"><span id="who">photon</span>@<span id="pool-name">pool</span>:~ <b id="mode-tag" class="tag">...</b></span>
    <a class="lnk minerlink" data-nav="pool" href="/">POOL</a>
    <a class="lnk minerlink" data-nav="engine" href="/engine">ENGINE</a>
    <a class="lnk minerlink" data-nav="miner" href="/miner">MINER</a>
    <a class="lnk minerlink" data-nav="ops" href="/ops" hidden>OPS</a>
    <span class="clock" id="clock">--:--:--</span>
  </header>
  <div id="view" class="view"></div>
  <footer class="footer">
    <span class="fver" id="release">Photon Pool</span>
    <nav aria-label="Links">
      <a href="https://github.com/kutlusoy/elektron-net-photonpool" target="_blank" rel="noopener">Photon Pool GitHub</a>
      <a href="https://github.com/kutlusoy/elektron-net/releases" target="_blank" rel="noopener">Elektron Net</a>
      <a href="https://github.com/kutlusoy/elektron-net-mobile" target="_blank" rel="noopener">Elektron Mobile (Android)</a>
      <a href="https://mempool.elektron-net.org/" target="_blank" rel="noopener">Elektron Mempool</a>
      <a href="https://www.elektron-net.org/" target="_blank" rel="noopener">Website</a>
      <a href="https://x.com/kutlusoy" target="_blank" rel="noopener">X (Twitter)</a>
    </nav>
  </footer>
</div>
<script src="/common.js"></script>
<script src="/spa.js"></script>
<script src="/charts.js"></script>
<script src="/stats.js"></script>
<script src="/music.js"></script>
<script src="/depth.js"></script>
<script src="/public.js"></script>
<script src="/flow.js"></script>
<script src="/engine.js"></script>
<script src="/miner.js"></script>
</body>
</html>
