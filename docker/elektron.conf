# Elektron Net node configuration for the Docker setup.
# No passwords here: photond authenticates with the RPC cookie in the shared volume.

server=1
listen=1
bind=0.0.0.0:8333
maxconnections=125

# RPC is only reachable from other containers on the compose network.
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12

# The pool does not need a wallet on the node. Keep payouts in a separate wallet.
disablewallet=1

# Pruning is mandatory and automatic on Elektron Net (197,280 blocks); there is nothing to configure.
