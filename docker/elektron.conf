# Elektron Net node configuration for the Docker setup.
# No passwords here: photond authenticates with the RPC cookie in the shared volume.
# Options noted per line follow the usual Bitcoin Core configuration: 0/1 switches take 1 (on) or 0 (off), other values are shown.

# Run as RPC server. Options: 0 | 1.
server=1
# Accept incoming P2P connections. Options: 0 | 1.
listen=1
# Address and port for P2P. Options: "ip:port".
bind=0.0.0.0:8333
# Most peers. Options: whole number, default 125.
maxconnections=125

# RPC is only reachable from other containers on the compose network.
# rpcbind options: "ip" (all interfaces with 0.0.0.0); rpcallowip options: "ip" or CIDR such as 172.16.0.0/12 (the Docker networks).
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12

# The payout wallet lives on this node (payout.wallet in photond.toml). Options: 0 (wallet on) | 1 (wallet off, no PPLNS/PPS payouts).
disablewallet=0

# elektrond writes a stray default config into the data directory on its first start; without this
# its own safety check then refuses to start. Options: 0 | 1.
allowignoredconf=1

# Pruning is mandatory and automatic on Elektron Net (197,280 blocks); there is nothing to configure.
# Useful extras when the node is also a Photon gateway's node: blockreservedweight is set automatically by getattestationbatch; nothing to add.
